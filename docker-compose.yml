version: '3.8'

services:
  meshmanager:
    build: .
    container_name: meshmanager-mesh
    restart: always
    ports:
      - "20128:20128"
    environment:
      - PORT=20128
      - NODE_ENV=production
    volumes:
      - ~/.meshmanager:/root/.meshmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:20128/api/stats"]
      interval: 15s
      timeout: 5s
      retries: 3
